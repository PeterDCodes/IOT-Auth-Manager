# docker-compose.yaml
services:
  auth-server:
    build: .
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      # PostgreSQL runs on the host, outside this container.
      PGHOST: host.docker.internal
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem

    # volumes:
    #   - /home/ultra/Secrets/IOT-AUTH-MANAGER/private.pem:/keys/private.pem:ro
    #   - /home/ultra/Secrets/IOT-AUTH-MANAGER/public.pem:/keys/public.pem:ro

    env_file:
      - .env
