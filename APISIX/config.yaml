apisix:
  proxy_mode: http&stream   # or 'stream' for stream proxy only
  stream_proxy:
    tcp:
      - addr: 9100          # listen on port 9100 across all interfaces
      - addr: "127.0.0.1:9101"
    udp:
      - 9200                # listen on UDP port 9200 across all interfaces

  # Defines path of custom plugins
  extra_lua_path: "/opt/custom-plugins/?.lua"

# An explicit list replaces the built-in stream plugin defaults.
stream_plugins:
  - ip-restriction
  - limit-conn
  - mqtt-proxy
  - syslog
  - traffic-split
  - mqtt-auth-proxy


deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    enable_admin_ui: true

    admin_key:
      - name: admin
        key: ${{ADMIN_KEY}}
        role: admin

    allow_admin:
      - 127.0.0.1/24
      - 172.16.0.0/12

  etcd:
    host:
      - "http://etcd:2379"




